<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/login.min.css">
</head>
<body>

    <main class="portal-wrapper">
        <section class="form-panel">
            <div class="form-top">
                <div class="role-switch-container" id="roleContainer" role="tablist" aria-label="Portal Selection">
                    <button type="button" class="role-pill active" id="btnStudentRole" role="tab" aria-selected="true">
                        <span>🎓 Student</span>
                    </button>
                    <button type="button" class="role-pill" id="btnStaffRole" role="tab" aria-selected="false">
                        <span>🛡️ Staff & HOD</span>
                    </button>
                </div>

                <h1 class="form-heading" id="formHeading">Login</h1>
                <p class="form-subtext" id="formSubtext">Enter your account details</p>

                <div id="alertBanner" class="alert-banner" role="alert">
                    <span id="alertIcon">⚠️</span>
                    <span id="alertText"></span>
                </div>

                <form id="authForm" autocomplete="on">
                    <div class="input-group" id="fullNameGroup" style="display: none;">
                        <label class="input-label" for="fullName">Full Name</label>
                        <div class="input-field-wrap">
                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                class="minimal-input"
                                placeholder="Enter your full name"
                                autocomplete="name"
                            />
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="username">Username</label>
                        <div class="input-field-wrap">
                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="minimal-input"
                                placeholder="Enter username"
                                required
                                autocomplete="username"
                            />
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="password">Password</label>
                        <div class="input-field-wrap">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="minimal-input"
                                placeholder="••••••••"
                                required
                                autocomplete="current-password"
                            />
                            <button
                                type="button"
                                class="eye-toggle-btn"
                                id="togglePasswordBtn"
                                aria-label="Toggle password visibility"
                            >
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <svg id="eyeOffIcon" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="forgot-wrap" id="forgotWrap">
                        <button type="button" class="forgot-btn" id="forgotBtn">Forgot Password?</button>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span id="submitBtnSpinner" class="spinner" style="display: none;"></span>
                        <span id="submitBtnText">Login</span>
                    </button>
                </form>
            </div>

            <div class="bottom-action-row" id="bottomActionRow">
                <span id="bottomQuestionText">Don't have an account?</span>
                <button type="button" class="toggle-mode-btn" id="toggleModeBtn">Sign up</button>
            </div>
        </section>

        <section class="banner-panel" aria-label="Portal Banner">
            <div class="blob-1"></div>
            <div class="blob-2"></div>
            <div class="blob-3"></div>

            <div class="banner-header">
                <h2 class="portal-title">
                    <span>Welcome to</span>
                    <span id="bannerPortalName">student portal</span>
                </h2>
                <p class="portal-subtitle" id="bannerTagline">Login to access your account</p>
            </div>

            <div class="illustration-wrap">
                <img
                    src="images/student_portal_illustration.jpg"
                    alt="Student Portal Illustration"
                    class="illustration-img"
                    id="bannerImage"
                    draggable="false"
                />
            </div>
        </section>
    </main>

    <script src="/static/js/app.min.js" defer></script>
</body>
</html>
