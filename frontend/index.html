<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #0d0e12;
            --bg-card: #15161b;
            --text-white: #ffffff;
            --text-muted: #8b8e9b;
            --text-dim: #5c5e6b;
            --purple-primary: #8b5cf6;
            --purple-hover: #7c3aed;
            --purple-light: #a78bfa;
            --purple-subtle: rgba(139, 92, 246, 0.15);
            --border-line: #2b2c37;
            --border-hover: #484a5a;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-heading: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-white);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Outer Card Wrapper */
        .portal-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1080px;
            min-height: 640px;
            background: var(--bg-card);
            border-radius: 28px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* ===================================
           LEFT PANEL: LOGIN & SIGNUP FORM
           =================================== */
        .form-panel {
            padding: 3.5rem 3.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #15161b;
            position: relative;
        }

        .form-top {
            width: 100%;
        }

        /* Role Switcher Tabs */
        .role-switch-container {
            display: inline-flex;
            background: #1c1d24;
            border: 1px solid #272832;
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 1.75rem;
            gap: 2px;
        }

        .role-pill {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-main);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .role-pill.active {
            background: #8b5cf6;
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.4);
        }

        .role-pill:not(.active):hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
        }

        .form-heading {
            font-family: var(--font-heading);
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .form-subtext {
            color: var(--text-muted);
            font-size: 0.925rem;
            margin-top: 0.35rem;
            margin-bottom: 2.25rem;
            font-weight: 400;
        }

        /* Input Groups */
        .input-group {
            margin-bottom: 1.65rem;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            transition: color 0.2s;
        }

        .input-field-wrap {
            position: relative;
            display: flex;
            align-items: center;
            border-bottom: 1.5px solid var(--border-line);
            transition: border-color 0.25s ease;
        }

        .input-field-wrap:focus-within {
            border-bottom-color: var(--purple-primary);
        }

        .minimal-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-white);
            font-family: var(--font-main);
            font-size: 0.975rem;
            padding: 0.55rem 0;
            padding-right: 2.5rem;
            transition: color 0.2s;
        }

        .minimal-input::placeholder {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        /* Eye Icon Toggle Button */
        .eye-toggle-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .eye-toggle-btn:hover {
            color: var(--text-white);
        }

        .eye-toggle-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Forgot password link */
        .forgot-wrap {
            margin-top: 0.4rem;
            margin-bottom: 1.75rem;
            display: flex;
            justify-content: flex-start;
        }

        .forgot-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.825rem;
            font-family: var(--font-main);
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
        }

        .forgot-btn:hover {
            color: var(--purple-light);
            text-decoration: underline;
        }

        /* Alert notifications */
        .alert-banner {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.825rem;
            margin-bottom: 1.25rem;
            display: none;
            align-items: center;
            gap: 8px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        .alert-banner.error {
            display: flex;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-banner.success {
            display: flex;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: var(--purple-primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: var(--font-main);
            font-size: 0.98rem;
            font-weight: 600;
            padding: 0.88rem 1.5rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px -4px rgba(139, 92, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: var(--purple-hover);
            transform: translateY(-1.5px);
            box-shadow: 0 12px 28px -4px rgba(139, 92, 246, 0.55);
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Bottom Row */
        .bottom-action-row {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .toggle-mode-btn {
            margin-left: 0.75rem;
            background: #202127;
            border: 1px solid #2e303b;
            color: #e4e4e7;
            font-family: var(--font-main);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.45rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-mode-btn:hover {
            background: #2b2c35;
            border-color: #424453;
            color: #ffffff;
        }

        /* ===================================
           RIGHT PANEL: PURPLE BANNER & ART
           =================================== */
        .banner-panel {
            background: linear-gradient(145deg, #7c3aed 0%, #8b5cf6 50%, #6d28d9 100%);
            position: relative;
            padding: 3.5rem 3.5rem 1.5rem 3.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Organic Curved Blobs */
        .blob-1 {
            position: absolute;
            top: -12%;
            right: -10%;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.45) 0%, rgba(139, 92, 246, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .blob-2 {
            position: absolute;
            bottom: 5%;
            left: -15%;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.5) 0%, rgba(109, 40, 217, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .blob-3 {
            position: absolute;
            top: 35%;
            right: 15%;
            width: 260px;
            height: 260px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            pointer-events: none;
            filter: blur(20px);
        }

        .banner-header {
            position: relative;
            z-index: 5;
        }

        .portal-title {
            font-family: var(--font-heading);
            font-size: clamp(2.2rem, 3.2vw, 3rem);
            font-weight: 800;
            color: #ffffff;
            line-height: 1.12;
            letter-spacing: -0.025em;
        }

        .portal-title span {
            display: block;
        }

        .portal-subtitle {
            color: rgba(255, 255, 255, 0.88);
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 0.65rem;
            letter-spacing: -0.01em;
        }

        /* Illustration Artwork */
        .illustration-wrap {
            position: relative;
            z-index: 5;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-top: auto;
        }

        .illustration-img {
            width: 100%;
            max-height: 430px;
            object-fit: contain;
            border-radius: 16px;
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.25));
            transition: transform 0.4s ease;
        }

        .illustration-wrap:hover .illustration-img {
            transform: scale(1.015);
        }

        /* Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Layout for Tablets and Mobile */
        @media (max-width: 900px) {
            .portal-wrapper {
                grid-template-columns: 1fr;
                max-width: 520px;
                border-radius: 22px;
            }

            .form-panel {
                padding: 2.75rem 2rem;
            }

            .banner-panel {
                padding: 2.5rem 2rem 1.5rem 2rem;
                min-height: 380px;
            }

            .illustration-img {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>

    <main class="portal-wrapper">
        <!-- ==========================================
             LEFT PANEL: AUTHENTICATION FORM
             ========================================== -->
        <section class="form-panel">
            <div class="form-top">
                <!-- Role Switcher -->
                <div class="role-switch-container" id="roleContainer" role="tablist" aria-label="Portal Selection">
                    <button type="button" class="role-pill active" id="btnStudentRole" role="tab" aria-selected="true">
                        <span>🎓 Student</span>
                    </button>
                    <button type="button" class="role-pill" id="btnStaffRole" role="tab" aria-selected="false">
                        <span>🛡️ Staff & HOD</span>
                    </button>
                </div>

                <h1 class="form-heading" id="formHeading">Login</h1>
                <p class="form-subtext" id="formSubtext">Enter your account details</p>

                <!-- Status alert banner -->
                <div id="alertBanner" class="alert-banner" role="alert">
                    <span id="alertIcon">⚠️</span>
                    <span id="alertText"></span>
                </div>

                <form id="authForm" autocomplete="on">
                    <!-- Optional Name input (for Sign Up only) -->
                    <div class="input-group" id="fullNameGroup" style="display: none;">
                        <label class="input-label" for="fullName">Full Name</label>
                        <div class="input-field-wrap">
                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                class="minimal-input"
                                placeholder="Enter your full name"
                                autocomplete="name"
                            />
                        </div>
                    </div>

                    <!-- Username input -->
                    <div class="input-group">
                        <label class="input-label" for="username">Username</label>
                        <div class="input-field-wrap">
                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="minimal-input"
                                placeholder="Enter username"
                                required
                                autocomplete="username"
                            />
                        </div>
                    </div>

                    <!-- Password input with Eye Toggle -->
                    <div class="input-group">
                        <label class="input-label" for="password">Password</label>
                        <div class="input-field-wrap">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="minimal-input"
                                placeholder="••••••••"
                                required
                                autocomplete="current-password"
                            />
                            <button
                                type="button"
                                class="eye-toggle-btn"
                                id="togglePasswordBtn"
                                aria-label="Toggle password visibility"
                            >
                                <!-- Eye Icon (Default) -->
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <!-- Eye Off Icon (Hidden initially) -->
                                <svg id="eyeOffIcon" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Forgot Password Link -->
                    <div class="forgot-wrap" id="forgotWrap">
                        <button type="button" class="forgot-btn" id="forgotBtn">Forgot Password?</button>
                    </div>

                    <!-- Main Submit Action Button -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span id="submitBtnSpinner" class="spinner" style="display: none;"></span>
                        <span id="submitBtnText">Login</span>
                    </button>
                </form>
            </div>

            <!-- Bottom Mode Switcher -->
            <div class="bottom-action-row" id="bottomActionRow">
                <span id="bottomQuestionText">Don't have an account?</span>
                <button type="button" class="toggle-mode-btn" id="toggleModeBtn">Sign up</button>
            </div>
        </section>

        <!-- ==========================================
             RIGHT PANEL: PURPLE BANNER & VECTOR ART
             ========================================== -->
        <section class="banner-panel" aria-label="Portal Banner">
            <!-- Organic shape backdrops -->
            <div class="blob-1"></div>
            <div class="blob-2"></div>
            <div class="blob-3"></div>

            <div class="banner-header">
                <h2 class="portal-title">
                    <span>Welcome to</span>
                    <span id="bannerPortalName">student portal</span>
                </h2>
                <p class="portal-subtitle" id="bannerTagline">Login to access your account</p>
            </div>

            <div class="illustration-wrap">
                <img
                    src="images/student_portal_illustration.jpg"
                    alt="Student Portal Illustration"
                    class="illustration-img"
                    id="bannerImage"
                />
            </div>
        </section>
    </main>

    <!-- Script Handling Authentication & Interactions -->
    <script>
        (function() {
            // State
            let currentRole = 'student'; // 'student' | 'staff'
            let isSignUpMode = false;
            let isLoading = false;

            // DOM Elements
            const btnStudentRole = document.getElementById('btnStudentRole');
            const btnStaffRole = document.getElementById('btnStaffRole');
            const formHeading = document.getElementById('formHeading');
            const formSubtext = document.getElementById('formSubtext');
            const alertBanner = document.getElementById('alertBanner');
            const alertIcon = document.getElementById('alertIcon');
            const alertText = document.getElementById('alertText');
            const authForm = document.getElementById('authForm');
            const fullNameGroup = document.getElementById('fullNameGroup');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const eyeIcon = document.getElementById('eyeIcon');
            const eyeOffIcon = document.getElementById('eyeOffIcon');
            const forgotWrap = document.getElementById('forgotWrap');
            const forgotBtn = document.getElementById('forgotBtn');
            const submitBtn = document.getElementById('submitBtn');
            const submitBtnText = document.getElementById('submitBtnText');
            const submitBtnSpinner = document.getElementById('submitBtnSpinner');
            const bottomQuestionText = document.getElementById('bottomQuestionText');
            const toggleModeBtn = document.getElementById('toggleModeBtn');
            const bannerPortalName = document.getElementById('bannerPortalName');
            const bannerTagline = document.getElementById('bannerTagline');

            // Set Alert
            function showAlert(type, message) {
                alertBanner.className = `alert-banner ${type}`;
                alertIcon.textContent = type === 'error' ? '⚠️' : '✅';
                alertText.textContent = message;
                alertBanner.style.display = 'flex';
            }

            function clearAlert() {
                alertBanner.style.display = 'none';
                alertBanner.className = 'alert-banner';
                alertText.textContent = '';
            }

            // Role Switching
            function setRole(role) {
                currentRole = role;
                clearAlert();

                if (role === 'staff') {
                    btnStaffRole.classList.add('active');
                    btnStaffRole.setAttribute('aria-selected', 'true');
                    btnStudentRole.classList.remove('active');
                    btnStudentRole.setAttribute('aria-selected', 'false');

                    bannerPortalName.textContent = 'staff portal';
                    bannerTagline.textContent = 'Login to access department controls';

                    // Staff accounts cannot sign up directly
                    if (isSignUpMode) {
                        setMode(false);
                    }
                    bottomQuestionText.textContent = 'Staff account managed by Admin';
                    toggleModeBtn.style.display = 'none';
                    formSubtext.textContent = 'Enter your staff / HOD account details';
                } else {
                    btnStudentRole.classList.add('active');
                    btnStudentRole.setAttribute('aria-selected', 'true');
                    btnStaffRole.classList.remove('active');
                    btnStaffRole.setAttribute('aria-selected', 'false');

                    bannerPortalName.textContent = 'student portal';
                    bannerTagline.textContent = 'Login to access your account';

                    toggleModeBtn.style.display = 'inline-block';
                    bottomQuestionText.textContent = isSignUpMode ? 'Already have an account?' : "Don't have an account?";
                    formSubtext.textContent = isSignUpMode ? 'Enter your details to create an account' : 'Enter your account details';
                }
            }

            btnStudentRole.addEventListener('click', () => setRole('student'));
            btnStaffRole.addEventListener('click', () => setRole('staff'));

            // Toggle Password Visibility
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                eyeIcon.style.display = isPassword ? 'none' : 'block';
                eyeOffIcon.style.display = isPassword ? 'block' : 'none';
            });

            // Toggle Mode (Login vs Sign Up)
            function setMode(signUp) {
                isSignUpMode = signUp;
                clearAlert();

                if (isSignUpMode) {
                    formHeading.textContent = 'Sign Up';
                    formSubtext.textContent = 'Enter your details to create an account';
                    fullNameGroup.style.display = 'block';
                    forgotWrap.style.display = 'none';
                    submitBtnText.textContent = 'Sign Up';
                    bottomQuestionText.textContent = 'Already have an account?';
                    toggleModeBtn.textContent = 'Login';
                } else {
                    formHeading.textContent = 'Login';
                    formSubtext.textContent = currentRole === 'staff' ? 'Enter your staff / HOD account details' : 'Enter your account details';
                    fullNameGroup.style.display = 'none';
                    forgotWrap.style.display = 'flex';
                    submitBtnText.textContent = 'Login';
                    bottomQuestionText.textContent = "Don't have an account?";
                    toggleModeBtn.textContent = 'Sign up';
                }
            }

            toggleModeBtn.addEventListener('click', () => {
                setMode(!isSignUpMode);
            });

            // Forgot Password helper
            forgotBtn.addEventListener('click', () => {
                showAlert('error', 'Please contact your departmental administrator or lab coordinator to reset your credentials.');
            });

            // Loading state helper
            function setLoading(loading, customText) {
                isLoading = loading;
                submitBtn.disabled = loading;
                submitBtnSpinner.style.display = loading ? 'inline-block' : 'none';
                submitBtnText.textContent = customText || (isSignUpMode ? 'Sign Up' : 'Login');
            }

            // Form Submit Handler
            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearAlert();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    showAlert('error', 'Please fill in both username and password.');
                    return;
                }

                if (isSignUpMode) {
                    // Register student account
                    if (password.length < 6) {
                        showAlert('error', 'Password must be at least 6 characters.');
                        return;
                    }

                    setLoading(true, 'Creating account...');

                    try {
                        const res = await fetch('/signup', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password })
                        });
                        const data = await res.json();

                        if (!res.ok || !data.success) {
                            showAlert('error', data.message || 'Registration failed. Try a different username.');
                            setLoading(false);
                            return;
                        }

                        showAlert('success', 'Student account created successfully! Switching to login...');
                        setTimeout(() => {
                            setMode(false);
                            usernameInput.value = username;
                            passwordInput.value = password;
                            setLoading(false);
                        }, 1200);

                    } catch (err) {
                        showAlert('error', 'Server error during registration. Please verify connection.');
                        setLoading(false);
                    }

                } else {
                    // Login Handler
                    setLoading(true, 'Signing in...');

                    try {
                        const targetRole = currentRole;

                        // Call backend login
                        const response = await fetch('/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username,
                                password,
                                role: targetRole
                            })
                        });

                        const data = await response.json();

                        // If login failed under current role, check if user is in opposite role (smart auto-detection)
                        if (!response.ok || !data.success) {
                            const fallbackRole = targetRole === 'student' ? 'staff' : 'student';
                            const fallbackRes = await fetch('/login', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    username,
                                    password,
                                    role: fallbackRole
                                })
                            });
                            const fallbackData = await fallbackRes.json();

                            if (fallbackRes.ok && fallbackData.success) {
                                // Fallback succeeded!
                                handleSuccessfulLogin(fallbackData, fallbackRole);
                                return;
                            }

                            showAlert('error', data.message || fallbackData.message || 'Invalid username or password.');
                            setLoading(false);
                            return;
                        }

                        // Direct success
                        handleSuccessfulLogin(data, targetRole);

                    } catch (err) {
                        showAlert('error', 'Unable to reach authentication server. Please check backend.');
                        setLoading(false);
                    }
                }
            });

            // Store credentials and redirect
            function handleSuccessfulLogin(data, role) {
                const username = data.username || data.user?.username;
                const userRole = data.role || data.user?.role || role;

                // Sync with localStorage & sessionStorage for both portals
                localStorage.setItem('username', username);
                localStorage.setItem('role', userRole);

                if (userRole === 'staff' || userRole === 'HOD OF DEP' || userRole === 'hod' || userRole === 'admin') {
                    sessionStorage.setItem('currentStaffUser', JSON.stringify(data.user || { username, role: 'staff' }));
                    showAlert('success', `Welcome back, ${username}! Redirecting to Staff Dashboard...`);
                    setTimeout(() => {
                        window.location.href = 'staff-dashboard.html';
                    }, 600);
                } else {
                    localStorage.setItem('studentUser', JSON.stringify(data.user || { username, role: 'student' }));
                    sessionStorage.setItem('currentUser', JSON.stringify(data.user || { username, role: 'student' }));
                    showAlert('success', `Welcome, ${username}! Redirecting to Student Dashboard...`);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 600);
                }
            }
        })();
    </script>
</body>
</html>
