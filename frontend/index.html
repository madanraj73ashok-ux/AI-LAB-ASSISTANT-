<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMize UI - Auth</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#000000',
                        foreground: '#ffffff',
                        card: '#0a0a0c',
                        border: '#27272a',
                        input: '#1f1f23',
                        'muted-foreground': '#a1a1aa'
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <!-- Tailwind 4 Tokens & Style -->
    <link rel="stylesheet" href="index.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Subtle starry dust or optional glyph stream */
        #glyph-stream-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
    </style>

    <!-- React 18, ReactDOM, and Babel Standalone for direct TSX execution in browser -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-white selection:bg-purple-900 selection:text-white">
    <!-- Liquid stream canvas in background -->
    <canvas id="glyph-stream-canvas"></canvas>

    <!-- React App Root Container -->
    <div id="root" class="relative z-10 w-full min-h-screen"></div>

    <!-- Glyph Stream Physics Engine -->
    <script src="glyph-stream.js"></script>

    <!-- React AuthUI Component Execution -->
    <script type="text/babel">
        const { useState, useEffect, useId } = React;

        // ==========================================
        // TYPEWRITER COMPONENT
        // ==========================================
        function Typewriter({
            text,
            speed = 80,
            cursor = "|",
            loop = true,
            deleteSpeed = 40,
            delay = 1800,
            className = ""
        }) {
            const [displayText, setDisplayText] = useState("");
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isDeleting, setIsDeleting] = useState(false);
            const [textArrayIndex, setTextArrayIndex] = useState(0);

            const textArray = Array.isArray(text) ? text : [text];
            const currentText = textArray[textArrayIndex] || "";

            useEffect(() => {
                if (!currentText) return;

                const timeout = setTimeout(
                    () => {
                        if (!isDeleting) {
                            if (currentIndex < currentText.length) {
                                setDisplayText((prev) => prev + currentText[currentIndex]);
                                setCurrentIndex((prev) => prev + 1);
                            } else if (loop) {
                                setTimeout(() => setIsDeleting(true), delay);
                            }
                        } else {
                            if (displayText.length > 0) {
                                setDisplayText((prev) => prev.slice(0, -1));
                            } else {
                                setIsDeleting(false);
                                setCurrentIndex(0);
                                setTextArrayIndex((prev) => (prev + 1) % textArray.length);
                            }
                        }
                    },
                    isDeleting ? deleteSpeed : speed
                );

                return () => clearTimeout(timeout);
            }, [
                currentIndex,
                isDeleting,
                currentText,
                loop,
                speed,
                deleteSpeed,
                delay,
                displayText,
                text
            ]);

            return (
                <span className={className}>
                    {displayText}
                    <span className="animate-pulse">{cursor}</span>
                </span>
            );
        }

        // ==========================================
        // PASSWORD INPUT WITH EYE/EYEOFF
        // ==========================================
        function PasswordInput({ id, label, value, onChange, placeholder = "Password", required = true, autoComplete = "current-password" }) {
            const [showPassword, setShowPassword] = useState(false);
            const inputId = id || useId();

            return (
                <div className="grid w-full items-center gap-2">
                    {label && (
                        <label htmlFor={inputId} className="text-sm font-medium leading-none text-zinc-200">
                            {label}
                        </label>
                    )}
                    <div className="relative">
                        <input
                            id={inputId}
                            type={showPassword ? "text" : "password"}
                            value={value}
                            onChange={onChange}
                            placeholder={placeholder}
                            required={required}
                            autoComplete={autoComplete}
                            className="flex h-10 w-full rounded-md border border-zinc-800 bg-zinc-950/80 px-3 py-2 text-sm text-white placeholder:text-zinc-500 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-zinc-600 transition-colors pe-10"
                        />
                        <button
                            type="button"
                            onClick={() => setShowPassword((prev) => !prev)}
                            className="absolute inset-y-0 end-0 flex h-full w-10 items-center justify-center text-zinc-400 transition-colors hover:text-zinc-200 focus:outline-none"
                            aria-label={showPassword ? "Hide password" : "Show password"}
                        >
                            {showPassword ? (
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                                </svg>
                            ) : (
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            )}
                        </button>
                    </div>
                </div>
            );
        }

        // ==========================================
        // SIGN IN FORM
        // ==========================================
        function SignInForm() {
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");

            const handleSignIn = async (event) => {
                event.preventDefault();
                setError("");
                setLoading(true);

                try {
                    // Try student login first
                    let response = await fetch("/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            username: email.trim(),
                            password: password.trim(),
                            role: "student"
                        })
                    });
                    let data = await response.json();

                    // If not found in student, try staff
                    if (!response.ok || !data.success) {
                        const staffRes = await fetch("/login", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                username: email.trim(),
                                password: password.trim(),
                                role: "staff"
                            })
                        });
                        const staffData = await staffRes.json();
                        if (staffRes.ok && staffData.success) {
                            sessionStorage.setItem("currentStaffUser", JSON.stringify(staffData.user || { username: staffData.username, role: "staff" }));
                            window.location.href = "staff-dashboard.html";
                            return;
                        }

                        setError(data.message || staffData.message || "Invalid credentials");
                        setLoading(false);
                        return;
                    }

                    // Student login success
                    sessionStorage.setItem("currentUser", JSON.stringify(data.user || { username: data.username, role: "student" }));
                    window.location.href = "dashboard.html";
                } catch (err) {
                    setError("Unable to connect to server. Check backend connection.");
                    setLoading(false);
                }
            };

            return (
                <form onSubmit={handleSignIn} autoComplete="on" className="flex flex-col gap-6">
                    <div className="flex flex-col items-center gap-1.5 text-center">
                        <h1 className="text-2xl font-bold tracking-tight text-white">Sign in to your account</h1>
                        <p className="text-sm text-zinc-400">Enter your email below to sign in</p>
                    </div>

                    {error && (
                        <div className="p-2.5 text-xs bg-red-950/40 border border-red-800/60 text-red-300 rounded-md text-center">
                            {error}
                        </div>
                    )}

                    <div className="grid gap-4">
                        <div className="grid gap-2 text-left">
                            <label htmlFor="email" className="text-sm font-medium leading-none text-zinc-200">Email</label>
                            <input
                                id="email"
                                name="email"
                                type="text"
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                placeholder="m@example.com"
                                required
                                autoComplete="email"
                                className="flex h-10 w-full rounded-md border border-zinc-800 bg-zinc-950/80 px-3 py-2 text-sm text-white placeholder:text-zinc-500 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-zinc-600 transition-colors"
                            />
                        </div>
                        <PasswordInput
                            name="password"
                            label="Password"
                            value={password}
                            onChange={(e) => setPassword(e.target.value)}
                            required
                            autoComplete="current-password"
                            placeholder="Password"
                        />
                        <button
                            type="submit"
                            disabled={loading}
                            className="mt-2 inline-flex h-10 items-center justify-center rounded-md border border-zinc-800 bg-zinc-950 hover:bg-zinc-900 text-sm font-medium text-white transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-zinc-600 disabled:opacity-50"
                        >
                            {loading ? "Signing in..." : "Sign In"}
                        </button>
                    </div>
                </form>
            );
        }

        // ==========================================
        // SIGN UP FORM
        // ==========================================
        function SignUpForm({ onSwitchToSignIn }) {
            const [name, setName] = useState("");
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [success, setSuccess] = useState("");

            const handleSignUp = async (event) => {
                event.preventDefault();
                setError("");
                setSuccess("");
                setLoading(true);

                try {
                    const response = await fetch("/signup", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            username: email.trim(),
                            password: password.trim()
                        })
                    });

                    const data = await response.json();

                    if (!response.ok || !data.success) {
                        setError(data.message || "Failed to create account.");
                        setLoading(false);
                        return;
                    }

                    setSuccess("Account created successfully! Switching to sign in...");
                    setTimeout(() => {
                        onSwitchToSignIn();
                    }, 1400);
                } catch (err) {
                    setError("Server error during sign up.");
                    setLoading(false);
                }
            };

            return (
                <form onSubmit={handleSignUp} autoComplete="on" className="flex flex-col gap-6">
                    <div className="flex flex-col items-center gap-1.5 text-center">
                        <h1 className="text-2xl font-bold tracking-tight text-white">Create an account</h1>
                        <p className="text-sm text-zinc-400">Enter your details below to sign up</p>
                    </div>

                    {error && (
                        <div className="p-2.5 text-xs bg-red-950/40 border border-red-800/60 text-red-300 rounded-md text-center">
                            {error}
                        </div>
                    )}

                    {success && (
                        <div className="p-2.5 text-xs bg-emerald-950/40 border border-emerald-800/60 text-emerald-300 rounded-md text-center">
                            {success}
                        </div>
                    )}

                    <div className="grid gap-4">
                        <div className="grid gap-1.5 text-left">
                            <label htmlFor="name" className="text-sm font-medium leading-none text-zinc-200">Full Name</label>
                            <input
                                id="name"
                                name="name"
                                type="text"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                                placeholder="John Doe"
                                required
                                autoComplete="name"
                                className="flex h-10 w-full rounded-md border border-zinc-800 bg-zinc-950/80 px-3 py-2 text-sm text-white placeholder:text-zinc-500 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-zinc-600 transition-colors"
                            />
                        </div>
                        <div className="grid gap-1.5 text-left">
                            <label htmlFor="email" className="text-sm font-medium leading-none text-zinc-200">Email</label>
                            <input
                                id="email"
                                name="email"
                                type="text"
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                placeholder="m@example.com"
                                required
                                autoComplete="email"
                                className="flex h-10 w-full rounded-md border border-zinc-800 bg-zinc-950/80 px-3 py-2 text-sm text-white placeholder:text-zinc-500 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-zinc-600 transition-colors"
                            />
                        </div>
                        <PasswordInput
                            name="password"
                            label="Password"
                            value={password}
                            onChange={(e) => setPassword(e.target.value)}
                            required
                            autoComplete="new-password"
                            placeholder="Password"
                        />
                        <button
                            type="submit"
                            disabled={loading}
                            className="mt-2 inline-flex h-10 items-center justify-center rounded-md border border-zinc-800 bg-zinc-950 hover:bg-zinc-900 text-sm font-medium text-white transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-zinc-600 disabled:opacity-50"
                        >
                            {loading ? "Creating account..." : "Sign Up"}
                        </button>
                    </div>
                </form>
            );
        }

        // ==========================================
        // AUTH FORM CONTAINER
        // ==========================================
        function AuthFormContainer({ isSignIn, onToggle }) {
            return (
                <div className="mx-auto grid w-[350px] gap-4">
                    {isSignIn ? (
                        <SignInForm />
                    ) : (
                        <SignUpForm onSwitchToSignIn={onToggle} />
                    )}

                    <div className="text-center text-sm text-zinc-400">
                        {isSignIn ? "Don't have an account?" : "Already have an account?"}{" "}
                        <button
                            type="button"
                            onClick={onToggle}
                            className="font-medium text-white hover:underline pl-1 cursor-pointer"
                        >
                            {isSignIn ? "Sign up" : "Sign in"}
                        </button>
                    </div>

                    <div className="relative text-center text-sm after:absolute after:inset-0 after:top-1/2 after:z-0 after:flex after:items-center after:border-t after:border-zinc-800">
                        <span className="relative z-10 bg-black px-2 text-zinc-500 text-xs">Or continue with</span>
                    </div>

                    <button
                        type="button"
                        onClick={() => alert("Institutional Google SSO login is active. Please use your campus email.")}
                        className="inline-flex h-10 items-center justify-center gap-2 rounded-md border border-zinc-800 bg-black hover:bg-zinc-900 text-sm font-medium text-white transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-zinc-600"
                    >
                        <svg className="mr-2 h-4 w-4" viewBox="0 0 24 24">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                fill="#4285F4"
                            />
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853"
                            />
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                                fill="#FBBC05"
                            />
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                                fill="#EA4335"
                            />
                        </svg>
                        Continue with Google
                    </button>
                </div>
            );
        }

        // ==========================================
        // CONTENT CONFIGURATION
        // ==========================================
        const defaultSignInContent = {
            image: {
                src: "https://cdn.21st.dev/assets/mirror/39/39e7b0edd6a7156713d08ec970769bf29360427d3dc8523ee32079885ccca5dd.png",
                alt: "A beautiful interior design for sign-in"
            },
            quote: {
                text: "Welcome Back! The journey continues.",
                author: "EaseMize UI"
            }
        };

        const defaultSignUpContent = {
            image: {
                src: "https://cdn.21st.dev/assets/mirror/c7/c7cb3a073970aa03472c652391db88fbbe39f1e33c8deb336a9c8e53b039ee01.png",
                alt: "A vibrant, modern space for new beginnings"
            },
            quote: {
                text: "Create an account. A new chapter awaits.",
                author: "EaseMize UI"
            }
        };

        // ==========================================
        // AUTHUI COMPONENT
        // ==========================================
        function AuthUI({ signInContent = {}, signUpContent = {} }) {
            const [isSignIn, setIsSignIn] = useState(false); // default to false to showcase SignUp like screenshot
            const toggleForm = () => setIsSignIn((prev) => !prev);

            const finalSignInContent = {
                image: { ...defaultSignInContent.image, ...signInContent.image },
                quote: { ...defaultSignInContent.quote, ...signInContent.quote },
            };
            const finalSignUpContent = {
                image: { ...defaultSignUpContent.image, ...signUpContent.image },
                quote: { ...defaultSignUpContent.quote, ...signUpContent.quote },
            };

            const currentContent = isSignIn ? finalSignInContent : finalSignUpContent;

            return (
                <div className="w-full min-h-screen md:grid md:grid-cols-2 bg-black text-white relative">
                    {/* Top Left DemoOne dropdown pill */}
                    <div className="absolute top-6 left-6 z-20">
                        <button
                            type="button"
                            onClick={toggleForm}
                            className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-zinc-300 bg-zinc-900/80 hover:bg-zinc-800 rounded-lg border border-zinc-800/80 transition-all cursor-pointer shadow-sm"
                        >
                            <span>DemoOne</span>
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                    </div>

                    {/* Left Panel: Form */}
                    <div className="flex h-screen items-center justify-center p-6 md:h-auto md:p-0 md:py-12 relative z-10">
                        <AuthFormContainer isSignIn={isSignIn} onToggle={toggleForm} />
                    </div>

                    {/* Right Panel: Floating Astronaut Background Image with Typewriter Quote */}
                    <div
                        className="hidden md:flex flex-col justify-end relative bg-cover bg-center transition-all duration-700 ease-in-out"
                        style={{
                            backgroundImage: `url(${currentContent.image.src})`,
                            backgroundRepeat: "no-repeat",
                            backgroundPosition: "center",
                            backgroundSize: "contain",
                            backgroundColor: "#000000"
                        }}
                        key={currentContent.image.src}
                    >
                        <div className="absolute inset-x-0 bottom-0 h-[120px] bg-gradient-to-t from-black to-transparent pointer-events-none" />
                        
                        <div className="relative z-10 flex h-full flex-col items-center justify-end p-6 pb-12">
                            <blockquote className="space-y-2 text-center text-white">
                                <p className="text-xl font-medium tracking-tight">
                                    “<Typewriter
                                        key={currentContent.quote.text}
                                        text={currentContent.quote.text}
                                        speed={70}
                                        delay={2000}
                                    />”
                                </p>
                                <cite className="block text-xs font-light text-zinc-400 not-italic tracking-wider">
                                    — {currentContent.quote.author}
                                </cite>
                            </blockquote>
                        </div>
                    </div>
                </div>
            );
        }

        // Mount to DOM
        const rootElement = document.getElementById("root");
        if (rootElement) {
            ReactDOM.createRoot(rootElement).render(<AuthUI />);
        }
    </script>
</body>
</html>
